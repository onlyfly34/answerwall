name: Set up the workspace
description: Installs pnpm (the version in packageManager), Node (the version in .nvmrc) and the dependencies.

runs:
  using: composite
  steps:
    # Reads the version from the packageManager field of package.json.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    # After pnpm, so that the cache step can ask pnpm where its store is.
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
