name: Container image

# The reusable build of the server image (apps/server/Dockerfile).
#
# Each architecture is built on a runner of that architecture, without
# emulation, and the built image is started and exercised with the mock CLIs
# before anything else happens (docker/test/smoke.mjs: GET /api/meta, pairing,
# one ask, shutdown).
#
#   push: false  build and test only. No job that runs can write a package.
#   push: true   additionally push each architecture to GHCR by digest and
#                join the two digests under the tags of the release.
#
# Tags come from `tag` (v<major>.<minor>.<patch>[-<pre-release>]):
#   v1.2.3       -> 1.2.3, 1.2, latest
#   v1.2.3-rc.1  -> 1.2.3-rc.1          (a pre-release never moves 1.2 or latest)
#
# Permissions: the build-only job asks for `contents: read` and nothing else.
# The two publishing jobs declare none and inherit the calling job's, so a
# caller that pushes grants `packages: write` to the job that calls this
# workflow, and a build-only caller grants nothing beyond `contents: read`.
# (GitHub refuses at load time a called workflow whose jobs ask for more
# than the caller grants, also for jobs that would be skipped, which is why
# the publishing jobs do not ask for it themselves.)

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to GHCR and tag it. False builds and tests only.
        type: boolean
        default: false
      tag:
        description: The release tag (v1.2.3 or v1.2.3-rc.1). Required with push.
        type: string
        default: ''
      image:
        description: Image name without a tag. Default is ghcr.io/<owner>/<repository>.
        type: string
        default: ''
    outputs:
      image:
        description: The image name that was pushed, without a tag.
        value: ${{ jobs.manifest.outputs.image }}
      digest:
        description: Digest of the multi-architecture manifest.
        value: ${{ jobs.manifest.outputs.digest }}
      tags:
        description: The tags that were set, separated by spaces.
        value: ${{ jobs.manifest.outputs.tags }}

defaults:
  run:
    shell: bash

env:
  # The name the freshly built image gets on the runner, for the test.
  LOCAL_IMAGE: answerwall:ci

jobs:
  # ------------------------------------------------------------ build only
  build:
    name: Build (${{ matrix.platform }})
    if: ${{ !inputs.push }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy: &platforms
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Node as everywhere else, for the test script only; the image
      # brings its own.
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - &buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The labels of the image and the time stamps inside it come from the
      # commit, so both builds of a release describe the same thing.
      - &describe
        name: Describe the build
        id: describe
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(jq -r .version apps/server/package.json)"
          image="${IMAGE_INPUT:-ghcr.io/$REPOSITORY}"
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git log -1 --format=%cI)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "image=${image,,}"
          } >> "$GITHUB_OUTPUT"

      - &build
        name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          # An attestation cannot be loaded into the local image store.
          provenance: false
          build-args: |
            VERSION=${{ steps.describe.outputs.version }}
            REVISION=${{ steps.describe.outputs.revision }}
            CREATED=${{ steps.describe.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.describe.outputs.epoch }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max,ignore-error=true

      # Starts the image exactly as docker/compose.yaml does and talks to it:
      # GET /api/meta over TLS, pairing, one ask across the mock CLIs, cancel,
      # stop, re-create. No AI command-line tool and no account is involved.
      - &test
        name: Start the image and query it
        run: node docker/test/smoke.mjs --no-build --image "$LOCAL_IMAGE"

  # ----------------------------------------------------- build and publish
  # The same steps, then the push. Only these two jobs may write packages,
  # with the permissions of the calling job (contents: read, packages: write).
  publish:
    name: Publish (${{ matrix.platform }})
    if: ${{ inputs.push }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy: *platforms
    outputs:
      image: ${{ steps.describe.outputs.image }}
      version: ${{ steps.describe.outputs.version }}
      revision: ${{ steps.describe.outputs.revision }}
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::push needs a tag v<major>.<minor>.<patch>[-<pre-release>], got \"$TAG\"."
            exit 1
          fi
      - *checkout
      - *node
      - *buildx
      - *describe
      - name: Check the version against the tag
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.describe.outputs.version }}
        run: |
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "::error::apps/server/package.json has version $VERSION, the tag is $TAG."
            exit 1
          fi
      - *build
      - *test

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Every layer comes from the build above, which the test just ran. The
      # image is pushed without a tag; the manifest job names it.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.describe.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.describe.outputs.version }}
            REVISION=${{ steps.describe.outputs.revision }}
            CREATED=${{ steps.describe.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.describe.outputs.epoch }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      # The name must not start with `release-`: those artifacts become
      # assets of the GitHub Release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  manifest:
    name: Tag the multi-architecture image
    if: ${{ inputs.push }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ steps.create.outputs.digest }}
      tags: ${{ steps.tags.outputs.tags }}
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Choose the tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          tags=("$version")
          # A pre-release (anything after a hyphen) gets its own tag only.
          if [[ "$version" != *-* ]]; then
            tags+=("${version%.*}" latest)
          fi
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags[*]}"

      - name: Create the manifest
        id: create
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: ${{ needs.publish.outputs.version }}
          REVISION: ${{ needs.publish.outputs.revision }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          shopt -s nullglob
          digests=(*)
          if (( ${#digests[@]} != 2 )); then
            echo "::error::Expected the digests of two architectures, found ${#digests[@]}."
            exit 1
          fi
          arguments=()
          for tag in $TAGS; do arguments+=(--tag "$IMAGE:$tag"); done
          # Annotations of the index: what the registry shows for the image.
          arguments+=(
            --annotation "index:org.opencontainers.image.source=$SOURCE"
            --annotation "index:org.opencontainers.image.licenses=MIT"
            --annotation "index:org.opencontainers.image.version=$VERSION"
            --annotation "index:org.opencontainers.image.revision=$REVISION"
          )
          for digest in "${digests[@]}"; do arguments+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${arguments[@]}"
          first="${TAGS%% *}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$first" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check the published image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          first="${TAGS%% *}"
          platforms="$(docker buildx imagetools inspect "$IMAGE:$first" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "Platforms: $platforms"
          for platform in linux/amd64 linux/arm64; do
            if [[ " $platforms " != *" $platform "* ]]; then
              echo "::error::$IMAGE:$first has no $platform image."
              exit 1
            fi
          done
