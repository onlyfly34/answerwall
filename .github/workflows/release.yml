name: Release

# A tag v<version> builds every asset, creates the GitHub Release as a draft,
# uploads the assets and publishes the release in the last step, so a release
# with missing assets is never visible. A manual run stops after the build and
# leaves the assets as a workflow artifact.
#
# How to add a build job (the Windows installer, the container image) is
# described in docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Read the tag
        id: plan
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/tags/* ]]; then
            echo "A manual run: build only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag $tag is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<pre-release>."
            exit 1
          fi
          prerelease=false
          if [[ "$tag" == *-* ]]; then prerelease=true; fi
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    with:
      skip-bundle: true

  # Fails when the version in apps/server/package.json is not the tagged one.
  build:
    name: Build
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      artifact-name: release-server-bundle
      expected-version: ${{ needs.plan.outputs.version }}

  # Every build job uploads its files as an artifact named `release-*` and is
  # listed in `needs` here. This job is the only place that knows the full set.
  assets:
    name: Collect the assets
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          shopt -s nullglob
          files=(*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release asset was built."
            exit 1
          fi
          sha256sum -- "${files[@]}" | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish
    if: ${{ needs.plan.outputs.publish == 'true' }}
    needs: [plan, verify, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: assets
      - name: Check the assets against SHA256SUMS
        working-directory: assets
        run: sha256sum --check --strict SHA256SUMS

      # A draft left by a failed earlier run is reused; a published release is
      # never touched.
      - name: Create the draft release
        run: |
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$state" != "true" ]]; then
              echo "::error::The release $TAG is already published."
              exit 1
            fi
            echo "Reusing the existing draft of $TAG."
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
              --prerelease="$PRERELEASE"
          fi
      - name: Upload the assets
        run: gh release upload "$TAG" assets/* --clobber
      - name: Check that every asset arrived
        run: |
          diff <(cd assets && printf '%s\n' * | sort) \
               <(gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | sort)
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
